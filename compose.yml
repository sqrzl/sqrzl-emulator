services:
  sqrzl:
    container_name: sqrzl
    hostname: sqrzl
    image: sqrzl:latest
    build:
      context: .
      tags:
        - sqrzl-emulator:latest
    ports:
      - "9000:9000"
      - "9001:9001"
      - "2525:2525"
    environment:
      SQRZL_BLOBS_PATH: /app/blobs
      SQRZL_LOG_FORMAT: text
      SQRZL_ACCESS_KEY_ID: admin
      SQRZL_SECRET_ACCESS_KEY: sqrzl-secret
    volumes:
      - sqrzl-blobs:/app/blobs

volumes:
  sqrzl-blobs:
