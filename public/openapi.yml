openapi: 3.1.0
info:
  title: Sqrzl Emulator Admin API
  version: 1.0.0
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  summary: Versioned storage administration API for the Sqrzl emulator.
  description: >-
    The admin API provides a RESTful JSON control plane for browsing and
    manipulating emulator-backed storage resources. It is intentionally
    separate from the S3, Azure Blob Storage, Google Cloud Storage, and OCI
    compatibility front doors.

    Version 1 covers bucket, object, ACL, policy, lifecycle, multipart upload,
    and version administration for local development workflows.
servers:
  - url: /admin/v1
    description: Admin API root on the current host
security:
  - AdminSessionCookie: []
tags:
  - name: Auth
    description: Authentication session management.
  - name: Buckets
    description: Bucket-level storage administration operations.
  - name: Objects
    description: Object metadata and binary content operations.
  - name: Tags
    description: Object tagging operations.
  - name: Mail
    description: Captured email mailbox and message inspection operations.
  - name: Texts
    description: Bidirectional SMS and MMS inspection and simulation operations.
paths:
  /auth/login:
    post:
      security: []
      tags:
        - Auth
      operationId: loginAdminSession
      summary: Create admin session
      description: Exchanges admin credentials for an HttpOnly session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Session created successfully.
          headers:
            Set-Cookie:
              description: HttpOnly admin session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      security: []
      tags:
        - Auth
      operationId: logoutAdminSession
      summary: Clear admin session
      description: Clears the admin session cookie for the current browser.
      responses:
        '200':
          description: Session cleared successfully.
          headers:
            Set-Cookie:
              description: Expired admin session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/session:
    get:
      security:
        - AdminSessionCookie: []
        - {}
      tags:
        - Auth
      operationId: getAdminSession
      summary: Get admin session status
      description: >-
        Resolves whether the current browser request is operating through an
        authenticated session or an open local-development admin API
        configuration.
      responses:
        '200':
          description: Session status returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets:
    get:
      tags:
        - Buckets
      operationId: listBuckets
      summary: List buckets
      parameters:
        - $ref: '#/components/parameters/Next'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Buckets returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBucketsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Buckets
      operationId: createBucket
      summary: Create bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBucketRequest'
      responses:
        '201':
          description: Bucket created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: getBucket
      summary: Get bucket
      responses:
        '200':
          description: Bucket details returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: deleteBucket
      summary: Delete bucket
      responses:
        '204':
          description: Bucket deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/versioning:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: getBucketVersioning
      summary: Get bucket versioning status
      responses:
        '200':
          description: Versioning status returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersioningStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: setBucketVersioning
      summary: Set bucket versioning status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersioningStatus'
      responses:
        '200':
          description: Versioning status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersioningStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/acl:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: getBucketAcl
      summary: Get bucket ACL
      responses:
        '200':
          description: Bucket ACL returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: setBucketAcl
      summary: Replace bucket ACL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Acl'
      responses:
        '200':
          description: Bucket ACL replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/policy:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: getBucketPolicy
      summary: Get bucket policy
      responses:
        '200':
          description: Bucket policy returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketPolicyDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: setBucketPolicy
      summary: Replace bucket policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketPolicyDocument'
      responses:
        '200':
          description: Bucket policy replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketPolicyDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: deleteBucketPolicy
      summary: Delete bucket policy
      responses:
        '204':
          description: Bucket policy deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/lifecycle:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: getBucketLifecycle
      summary: Get bucket lifecycle configuration
      responses:
        '200':
          description: Bucket lifecycle returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: setBucketLifecycle
      summary: Replace bucket lifecycle configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleConfiguration'
      responses:
        '200':
          description: Bucket lifecycle replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      parameters:
        - $ref: '#/components/parameters/BucketName'
      tags:
        - Buckets
      operationId: deleteBucketLifecycle
      summary: Delete bucket lifecycle configuration
      responses:
        '204':
          description: Bucket lifecycle deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/multipart-uploads:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/Next'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      tags:
        - Buckets
      operationId: listMultipartUploads
      summary: List multipart uploads
      responses:
        '200':
          description: Multipart uploads returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMultipartUploadsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/multipart-uploads/{uploadId}:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/UploadId'
      tags:
        - Buckets
      operationId: getMultipartUpload
      summary: Get multipart upload
      responses:
        '200':
          description: Multipart upload returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipartUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/UploadId'
      tags:
        - Buckets
      operationId: abortMultipartUpload
      summary: Abort multipart upload
      responses:
        '204':
          description: Multipart upload aborted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/objects:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/Next'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Prefix'
        - $ref: '#/components/parameters/Search'
      tags:
        - Objects
      operationId: listObjects
      summary: List blobs in a bucket
      responses:
        '200':
          description: Blobs returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListObjectsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/objects/{objectKey}:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      tags:
        - Objects
      operationId: getObjectMetadata
      summary: Get blob metadata
      responses:
        '200':
          description: Blob metadata returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      tags:
        - Objects
      operationId: deleteObject
      summary: Delete blob
      responses:
        '204':
          description: Blob deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/objects/{objectKey}/content:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      tags:
        - Objects
      operationId: downloadObjectContent
      summary: Download blob content
      responses:
        '200':
          description: Blob content returned.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      tags:
        - Objects
      operationId: putObjectContent
      summary: Create or replace blob content
      description: >-
        Stores arbitrary bytes for a slash-separated blob key and preserves the
        request content type when provided; otherwise the stored content type
        defaults to application/octet-stream. Request headers prefixed with
        `x-amz-meta-` are stored as blob metadata.
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Blob created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectMetadata'
        '200':
          description: Blob replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/objects/{objectKey}/versions:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/Next'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      tags:
        - Objects
      operationId: listObjectVersions
      summary: List blob versions
      responses:
        '200':
          description: Blob versions returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVersionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/objects/{objectKey}/versions/{versionId}:
    delete:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/VersionId'
      tags:
        - Objects
      operationId: deleteObjectVersion
      summary: Delete blob version
      responses:
        '204':
          description: Blob version deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/objects/{objectKey}/tags:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      tags:
        - Tags
      operationId: getObjectTags
      summary: Get blob tags
      responses:
        '200':
          description: Blob tags returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      tags:
        - Tags
      operationId: putObjectTags
      summary: Replace blob tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagsRequest'
      responses:
        '200':
          description: Blob tags replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /buckets/{bucketName}/objects/{objectKey}/acl:
    get:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      tags:
        - Objects
      operationId: getObjectAcl
      summary: Get blob ACL
      responses:
        '200':
          description: Blob ACL returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      tags:
        - Objects
      operationId: setObjectAcl
      summary: Replace blob ACL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Acl'
      responses:
        '200':
          description: Blob ACL replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /mailboxes:
    get:
      tags:
        - Mail
      operationId: listMailboxes
      summary: List captured mailboxes
      parameters:
        - $ref: '#/components/parameters/Next'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Mailboxes returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMailboxesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /mailboxes/{mailbox}:
    delete:
      parameters:
        - $ref: '#/components/parameters/Mailbox'
      tags:
        - Mail
      operationId: deleteMailbox
      summary: Delete a mailbox and all captured messages
      responses:
        '204':
          description: Mailbox deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /mailboxes/{mailbox}/messages:
    get:
      parameters:
        - $ref: '#/components/parameters/Mailbox'
        - $ref: '#/components/parameters/Next'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      tags:
        - Mail
      operationId: listMailboxMessages
      summary: List messages in a mailbox
      responses:
        '200':
          description: Mailbox messages returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMessagesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /mailboxes/{mailbox}/messages/{messageId}:
    get:
      parameters:
        - $ref: '#/components/parameters/Mailbox'
        - $ref: '#/components/parameters/MessageId'
      tags:
        - Mail
      operationId: getMailboxMessage
      summary: Get a mailbox message
      responses:
        '200':
          description: Message detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      parameters:
        - $ref: '#/components/parameters/Mailbox'
        - $ref: '#/components/parameters/MessageId'
      tags:
        - Mail
      operationId: deleteMailboxMessage
      summary: Delete a mailbox message
      responses:
        '204':
          description: Message deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /mailboxes/{mailbox}/messages/{messageId}/content:
    get:
      parameters:
        - $ref: '#/components/parameters/Mailbox'
        - $ref: '#/components/parameters/MessageId'
      tags:
        - Mail
      operationId: getMailboxMessageContent
      summary: Download raw message content
      responses:
        '200':
          description: Raw message content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /mailboxes/{mailbox}/messages/{messageId}/attachments/{filename}:
    get:
      parameters:
        - $ref: '#/components/parameters/Mailbox'
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/Filename'
      tags:
        - Mail
      operationId: getMailboxMessageAttachment
      summary: Download a message attachment
      responses:
        '200':
          description: Attachment content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /text-conversations:
    get:
      tags: [Texts]
      operationId: listTextConversations
      summary: List text conversations grouped by remote peer
      parameters:
        - $ref: '#/components/parameters/Next'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Text conversations returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTextConversationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /text-conversations/{peer}:
    delete:
      tags: [Texts]
      operationId: deleteTextConversation
      summary: Delete a text conversation and all canonical messages
      parameters:
        - $ref: '#/components/parameters/TextPeer'
      responses:
        '204':
          description: Conversation deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /text-conversations/{peer}/messages:
    get:
      tags: [Texts]
      operationId: listTextConversationMessages
      summary: List bidirectional messages for a peer
      parameters:
        - $ref: '#/components/parameters/TextPeer'
        - $ref: '#/components/parameters/Next'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Text messages returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTextMessagesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /text-conversations/{peer}/messages/{messageId}:
    get:
      tags: [Texts]
      operationId: getTextMessage
      summary: Get text message detail and callback history
      parameters:
        - $ref: '#/components/parameters/TextPeer'
        - $ref: '#/components/parameters/TextMessageId'
      responses:
        '200':
          description: Text message detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Texts]
      operationId: deleteTextMessage
      summary: Delete one canonical text message
      parameters:
        - $ref: '#/components/parameters/TextPeer'
        - $ref: '#/components/parameters/TextMessageId'
      responses:
        '204':
          description: Message deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /text-conversations/{peer}/messages/{messageId}/media/{mediaId}:
    get:
      tags: [Texts]
      operationId: getTextMessageMedia
      summary: Download locally stored inbound MMS media
      parameters:
        - $ref: '#/components/parameters/TextPeer'
        - $ref: '#/components/parameters/TextMessageId'
        - $ref: '#/components/parameters/TextMediaId'
      responses:
        '200':
          description: Locally stored media content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /text-simulations/inbound:
    post:
      tags: [Texts]
      operationId: simulateInboundText
      summary: Store an inbound SMS or Twilio MMS and attempt its configured callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundTextSimulationRequest'
      responses:
        '201':
          description: Inbound message stored; callback result is included when attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /text-messages/{messageId}/delivery:
    post:
      tags: [Texts]
      operationId: transitionTextDelivery
      summary: Explicitly transition an accepted outbound message to delivered or failed
      parameters:
        - $ref: '#/components/parameters/TextMessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextDeliveryRequest'
      responses:
        '200':
          description: Delivery state transitioned or idempotently confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextMessageDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /text-destinations/{provider}/{localNumber}:
    get:
      tags: [Texts]
      operationId: getTextDestination
      summary: Get a provider/local-number callback destination
      parameters:
        - $ref: '#/components/parameters/TextProvider'
        - $ref: '#/components/parameters/TextLocalNumber'
      responses:
        '200':
          description: Destination returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextDestination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Texts]
      operationId: putTextDestination
      summary: Create or replace a callback destination
      parameters:
        - $ref: '#/components/parameters/TextProvider'
        - $ref: '#/components/parameters/TextLocalNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutTextDestinationRequest'
      responses:
        '200':
          description: Destination stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextDestination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Texts]
      operationId: deleteTextDestination
      summary: Delete a callback destination
      parameters:
        - $ref: '#/components/parameters/TextProvider'
        - $ref: '#/components/parameters/TextLocalNumber'
      responses:
        '204':
          description: Destination deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /text-callback-attempts/{attemptId}/retry:
    post:
      tags: [Texts]
      operationId: retryTextCallback
      summary: Create a linked retry attempt without overwriting callback history
      parameters:
        - $ref: '#/components/parameters/TextAttemptId'
      responses:
        '200':
          description: Retry attempted and recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextCallbackAttempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: sqrzl_admin_session
      description: HttpOnly JWT session cookie issued by /auth/login.
  parameters:
    BucketName:
      name: bucketName
      in: path
      required: true
      description: Bucket name. Use 3-63 lowercase letters, numbers, and hyphens.
      schema:
        type: string
        minLength: 3
        maxLength: 63
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    ObjectKey:
      name: objectKey
      in: path
      required: true
      description: Slash-separated blob key. URL encode the full key when used in the path.
      schema:
        type: string
        minLength: 1
        pattern: '^[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*$'
    UploadId:
      name: uploadId
      in: path
      required: true
      description: Multipart upload ID.
      schema:
        type: string
        minLength: 1
    VersionId:
      name: versionId
      in: path
      required: true
      description: Object version identifier.
      schema:
        type: string
        minLength: 1
    Next:
      name: next
      in: query
      required: false
      description: Opaque next token returned by a previous list request.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return in this page.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Search:
      name: search
      in: query
      required: false
      description: Case-insensitive text search over resource names or keys.
      schema:
        type: string
    Prefix:
      name: prefix
      in: query
      required: false
      description: Restrict listing to keys that start with this prefix.
      schema:
        type: string
    Mailbox:
      name: mailbox
      in: path
      required: true
      description: Mailbox identifier (recipient email, URL encoded when required).
      schema:
        type: string
        minLength: 1
    MessageId:
      name: messageId
      in: path
      required: true
      description: Internal emulator message identifier.
      schema:
        type: string
        minLength: 1
    Filename:
      name: filename
      in: path
      required: true
      description: Attachment filename (URL encoded when required).
      schema:
        type: string
        minLength: 1
    TextPeer:
      name: peer
      in: path
      required: true
      description: Original remote phone number or peer key, URL encoded as one segment.
      schema:
        type: string
        minLength: 1
    TextMessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TextMediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TextProvider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TextProvider'
    TextLocalNumber:
      name: localNumber
      in: path
      required: true
      description: Provider-facing local number or identity, URL encoded as one segment.
      schema:
        type: string
        minLength: 1
    TextAttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    InvalidCredentials:
      description: The provided admin credentials are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required or the provided admin session cookie is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: The request could not be processed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: The request body exceeds the configured emulator limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: An internal emulator error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    AdminSessionResponse:
      type: object
      additionalProperties: false
      required:
        - mode
        - username
      properties:
        mode:
          type: string
          enum:
            - open
            - session
        username:
          type:
            - string
            - 'null'
    SuccessResponse:
      type: object
      additionalProperties: false
      required:
        - success
      properties:
        success:
          type: boolean
    CreateBucketRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    BucketInfo:
      type: object
      additionalProperties: false
      required:
        - name
        - created_at
        - versioning_enabled
      properties:
        name:
          type: string
        created_at:
          type: string
          format: date-time
        versioning_enabled:
          type: boolean
    BucketDetails:
      allOf:
        - $ref: '#/components/schemas/BucketInfo'
    ListBucketsResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - next
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BucketInfo'
        next:
          type:
            - string
            - 'null'
    VersioningStatus:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    ObjectInfo:
      type: object
      additionalProperties: false
      required:
        - key
        - size
        - last_modified
        - etag
        - content_type
        - storage_class
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        last_modified:
          type: string
          format: date-time
        etag:
          type: string
        content_type:
          type:
            - string
            - 'null'
        storage_class:
          type: string
    ObjectFolderInfo:
      type: object
      additionalProperties: false
      required:
        - name
        - prefix
      properties:
        name:
          type: string
        prefix:
          type: string
    ObjectMetadata:
      type: object
      additionalProperties: false
      required:
        - key
        - size
        - last_modified
        - etag
        - content_type
        - storage_class
        - metadata
        - version_id
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        last_modified:
          type: string
          format: date-time
        etag:
          type: string
        content_type:
          type:
            - string
            - 'null'
        metadata:
          type: object
          additionalProperties:
            type: string
        version_id:
          type:
            - string
            - 'null'
        storage_class:
          type: string
    ListObjectsResponse:
      type: object
      additionalProperties: false
      required:
        - folders
        - items
        - next
      properties:
        folders:
          type: array
          items:
            $ref: '#/components/schemas/ObjectFolderInfo'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObjectInfo'
        next:
          type:
            - string
            - 'null'
    ObjectVersionInfo:
      type: object
      additionalProperties: false
      required:
        - key
        - version_id
        - size
        - last_modified
        - etag
        - is_latest
      properties:
        key:
          type: string
        version_id:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        last_modified:
          type: string
          format: date-time
        etag:
          type: string
        is_latest:
          type: boolean
    ListVersionsResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - next
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObjectVersionInfo'
        next:
          type:
            - string
            - 'null'
    TagsRequest:
      type: object
      additionalProperties: false
      required:
        - tags
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
    TagsResponse:
      type: object
      additionalProperties: false
      required:
        - tags
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
    ListMultipartUploadsResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - next
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MultipartUpload'
        next:
          type:
            - string
            - 'null'
    MultipartUpload:
      type: object
      additionalProperties: false
      required:
        - upload_id
        - key
        - initiated
        - parts
      properties:
        upload_id:
          type: string
        key:
          type: string
        initiated:
          type: string
          format: date-time
        content_type:
          type:
            - string
            - 'null'
        metadata:
          type: object
          additionalProperties:
            type: string
        provider_metadata:
          type: object
          additionalProperties:
            type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/MultipartPart'
    MultipartPart:
      type: object
      additionalProperties: false
      required:
        - part_number
        - etag
        - size
        - last_modified
      properties:
        part_number:
          type: integer
          format: int32
          minimum: 1
        etag:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        last_modified:
          type: string
          format: date-time
    Acl:
      type: object
      additionalProperties: false
      required:
        - canned
      properties:
        canned:
          type: string
          enum:
            - private
            - public-read
            - public-read-write
            - authenticated-read
            - bucket-owner-read
            - bucket-owner-full-control
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
    Grant:
      type: object
      additionalProperties: false
      required:
        - grantee
        - permission
      properties:
        grantee:
          oneOf:
            - $ref: '#/components/schemas/CanonicalUserGrantee'
            - $ref: '#/components/schemas/GroupGrantee'
        permission:
          type: string
          enum:
            - READ
            - WRITE
            - READ_ACP
            - WRITE_ACP
            - FULL_CONTROL
    CanonicalUserGrantee:
      type: object
      additionalProperties: false
      required:
        - Type
        - ID
      properties:
        Type:
          type: string
          enum:
            - CanonicalUser
        ID:
          type: string
        DisplayName:
          type:
            - string
            - 'null'
    GroupGrantee:
      type: object
      additionalProperties: false
      required:
        - Type
        - URI
      properties:
        Type:
          type: string
          enum:
            - Group
        URI:
          type: string
    BucketPolicyDocument:
      type: object
      additionalProperties: false
      required:
        - Version
        - Statement
      properties:
        Version:
          type: string
        Statement:
          type: array
          items:
            $ref: '#/components/schemas/PolicyStatementDocument'
    PolicyStatementDocument:
      type: object
      additionalProperties: false
      required:
        - Effect
        - Principal
        - Action
        - Resource
      properties:
        Sid:
          type:
            - string
            - 'null'
        Effect:
          type: string
          enum:
            - Allow
            - Deny
        Principal:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/PolicyPrincipalAws'
        Action:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        Resource:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        Condition:
          type:
            - object
            - 'null'
          additionalProperties: true
    PolicyPrincipalAws:
      type: object
      additionalProperties: false
      required:
        - AWS
      properties:
        AWS:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    LifecycleConfiguration:
      type: object
      additionalProperties: false
      required:
        - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleRule'
    LifecycleRule:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - transitions
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - Enabled
            - Disabled
        filter:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/LifecycleFilter'
        expiration:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Expiration'
        noncurrent_version_expiration:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/NoncurrentVersionExpiration'
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/Transition'
    LifecycleFilter:
      type: object
      additionalProperties: false
      required:
        - tags
      properties:
        prefix:
          type:
            - string
            - 'null'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleTag'
    LifecycleTag:
      type: object
      additionalProperties: false
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string
    Expiration:
      type: object
      additionalProperties: false
      required:
        - days
        - date
        - expired_object_delete_marker
      properties:
        days:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 0
        date:
          type:
            - string
            - 'null'
        expired_object_delete_marker:
          type:
            - boolean
            - 'null'
    NoncurrentVersionExpiration:
      type: object
      additionalProperties: false
      required:
        - noncurrent_days
      properties:
        noncurrent_days:
          type: integer
          format: int32
          minimum: 0
    Transition:
      type: object
      additionalProperties: false
      required:
        - days
        - date
        - storage_class
      properties:
        days:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 0
        date:
          type:
            - string
            - 'null'
        storage_class:
          type: string
          enum:
            - STANDARD
            - GLACIER
            - DEEP_ARCHIVE
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable machine-readable error code.
        details:
          type:
            - string
            - 'null'
          description: Optional implementation-specific error context.
    MailAddress:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
        name:
          type:
            - string
            - 'null'
    MailboxInfo:
      type: object
      additionalProperties: false
      required:
        - address
        - message_count
        - last_received_at
      properties:
        address:
          type: string
        message_count:
          type: integer
          format: int64
          minimum: 0
        last_received_at:
          type:
            - string
            - 'null'
          format: date-time
    ListMailboxesResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - next
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MailboxInfo'
