name: Downstream storage qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/downstream-storage.yml

permissions:
  contents: read

jobs:
  full-hour:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        provider: [s3, azure, gcs_xml, gcs_json]
    env:
      CARGO_INCREMENTAL: "0"
      SQRZL_SECRET_ACCESS_KEY: easy-peasy
      STRESS_PROFILE: smoke
      MIDGE_STRESS_DURATION_SECS: "3600"
      STRESS_NO_PROGRESS_TIMEOUT_SECS: "60"
      STRESS_TIMEOUT_SECS: "4500"
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout unchanged downstream workload
        uses: actions/checkout@v6
        with:
          repository: cntryl/midge
          ref: 9bee951c78a0cd9743c7dfc004ae2e3013b52219
          path: downstream-midge

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache downstream Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: downstream-midge
          shared-key: downstream-storage

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sqrzl-downstream:qualification
          labels: org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=downstream-storage
          cache-to: type=gha,mode=min,scope=downstream-storage

      - name: Start isolated candidate storage
        run: |
          mkdir -p qualification
          git rev-parse HEAD > qualification/sqrzl-source.txt
          git -C downstream-midge rev-parse HEAD > qualification/midge-source.txt
          docker image inspect sqrzl-downstream:qualification > qualification/image.json
          docker run -d --name sqrzl-downstream \
            -p 9000:9000 -p 9001:9001 \
            -e SQRZL_ACCESS_KEY_ID=admin \
            -e SQRZL_SECRET_ACCESS_KEY \
            sqrzl-downstream:qualification

      - name: Run complete unchanged workload and recovery
        working-directory: downstream-midge
        shell: bash
        run: |
          cargo bench --locked --features stress-soak --bench tier5_stress_workloads -- \
            --workload 'tier5_stress_workloads::tier5_write_pressure_${{ matrix.provider }}' \
            2>&1 | tee ../qualification/workload.log

      - name: Preserve candidate runtime diagnostics
        if: always()
        run: |
          mkdir -p qualification
          docker logs sqrzl-downstream > qualification/emulator.log 2>&1 || true
          docker inspect sqrzl-downstream > qualification/container.json || true

      - name: Preserve exact workload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downstream-${{ matrix.provider }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            qualification/
            downstream-midge/target/stress/**
            downstream-midge/target/midge-stress/**
          if-no-files-found: error
          retention-days: 14

      - name: Stop owned candidate container
        if: always()
        run: docker stop sqrzl-downstream || true
