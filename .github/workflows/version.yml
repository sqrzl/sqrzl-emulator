name: Version

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      semver:
        description: Cargo workspace package version
        value: ${{ jobs.cargo-version.outputs.semver }}

permissions:
  contents: read

jobs:
  cargo-version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v7
      - name: Read Cargo workspace version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          printf 'semver=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Cargo version %s\n' "$version"
