[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sqrzl-emulator-sdk-certification"
version = "0.1.0"
description = "Official SDK certification harness for SQRZL emulator support workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "sqrzl" },
]
dependencies = []

[project.optional-dependencies]
sdk-tests = [
  "pytest==8.4.2",
  "boto3==1.43.110",
  "azure-storage-blob==12.31.0",
  "google-cloud-storage==3.17.0",
  "oci==2.187.2",
  "sendgrid==6.12.5",
  "azure-communication-email==1.1.0",
  "azure-communication-sms==1.1.0",
  "twilio==9.11.2",
]
sdk-upgrade = [
  "pytest>=8,<9",
  "boto3>=1.34,<2",
  "azure-storage-blob>=12.19,<13",
  "google-cloud-storage>=2.16,<4",
  "oci>=2.120,<3",
  "sendgrid>=6.11,<7",
  "azure-communication-email>=1.0,<2",
  "azure-communication-sms>=1.0,<2",
  "twilio>=9,<10",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["sdk-tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]
