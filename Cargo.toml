[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
incremental = false

[profile.test]
incremental = false

[workspace]
resolver = "2"
default-members = ["crates/sqrzl-server"]
members = [
    "crates/sqrzl-core",
    "crates/sqrzl-storage",
    "crates/sqrzl-object",
    "crates/sqrzl-server",
    "crates/sqrzl-messaging",
    "crates/sqrzl-vault",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/sqrzl/sqrzl-emulator"

[workspace.dependencies]
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "aws-lc-sys"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
crc32c = "0.6.9"
crc32fast = "1.5"
crc64fast-nvme = "1.2.1"
crossbeam-skiplist = "0.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
http = "1.5"
http-body-util = "0.1"
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "http2"] }
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
md5 = "0.8"
mime_guess = "2"
quick-xml = "0.42.0"
rand = "0.10.3"
redb = "=4.6.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.10.0", features = ["transport-streamable-http-server"] }
rsa = { version = "0.10.0", features = ["getrandom", "pkcs1v15"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "fs", "process", "signal"] }
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
urlencoding = "2"
uuid = { version = "1.29", features = ["v4", "serde"] }
libc = "0.2"
sqrzl-core = { path = "crates/sqrzl-core", version = "0.1.0" }
sqrzl-storage = { path = "crates/sqrzl-storage", version = "0.1.0" }
sqrzl-object = { path = "crates/sqrzl-object", version = "0.1.0" }
sqrzl-messaging = { path = "crates/sqrzl-messaging", version = "0.1.0" }
sqrzl-vault = { path = "crates/sqrzl-vault", version = "0.1.0" }
